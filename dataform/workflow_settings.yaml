# Dataform workflow settings

# Project settings
# Must match the GCP project that owns dwh_prod (hyphens, not underscores).
defaultProject: skir-sample-credit
defaultDataset: dwh_prod
defaultLocation: asia-northeast1

# Compilation variables
vars:
  env: "prod"
  # 評価テーブルの再計算は当日だけ（Batch が WRITE_TRUNCATE のため）。
  # 過去日を消して再計算するには使わない。
  reload_days: "3"