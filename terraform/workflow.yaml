# Terraform templatefile injects project_id, region, and dataform_repo.
# Workflows expressions are dollar-dollar-escaped so they survive templatefile.
# raise のメッセージに ": " が含まれる場合は YAML がそこで切れるため、全体を単引用符で囲む。
#
# GCP: Cloud Workflows が Cloud Run Jobs と Dataform を直列起動する。
# 実行 SA は sa-workflows-orchestrator（run.developer + dataform.editor）。
# jobs.run / compilationResults.create は非同期のため、完了をポーリングする。
# poll 10s × 60 回 = 600s は Cloud Run Job timeout と揃えて打ち切る。

main:
  steps:
    - init:
        assign:
          - project_id: "${project_id}"
          - region: "${region}"
          - dataform_parent: "projects/${project_id}/locations/${region}/repositories/${dataform_repo}"
          - poll_interval_seconds: 10
          - max_polls: 60
          - poll_count: 0

    # Step 1: Cloud Run Jobs を起動（v1 jobs.run は非同期）
    - run_ingestion_job:
        try:
          call: googleapis.run.v1.namespaces.jobs.run
          args:
            name: namespaces/${project_id}/jobs/daily-ingest-job
            location: ${region}
          result: job_execution
        # 起動 API の 429/502/503/504 のみ再試行（http.default_retry_predicate）。
        # Job 本体の失敗は下の status 判定で扱う（成功した実行を二重起動しない）。
        retry:
          predicate: $${http.default_retry_predicate}
          max_retries: 5
          backoff:
            initial_delay: 2
            max_delay: 32
            multiplier: 2

    - wait_for_job:
        call: sys.sleep
        args:
          seconds: $${poll_interval_seconds}

    - increment_job_poll:
        assign:
          - poll_count: $${poll_count + 1}

    - get_job_status:
        try:
          call: googleapis.run.v1.namespaces.executions.get
          args:
            # jobs.run の metadata.name は Execution の短い ID のみ。
            # それを name に使うと GET /v1/daily-ingest-job-xxx になり 404 になる。
            name: $${"namespaces/" + job_execution.metadata.namespace + "/executions/" + job_execution.metadata.name}
            location: ${region}
          result: job_status
        retry:
          predicate: $${http.default_retry_predicate}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 16
            multiplier: 2

    - check_job_status:
        switch:
          - condition: $${job_status.status.completionTime == null}
            next: check_job_poll_limit
          - condition: $${job_status.status.conditions[0].status == "True"}
            next: reset_poll_for_compile
          - condition: true
            raise: '$${"Cloud Run Job failed: " + default(job_status.status.conditions[0].message, "unknown error")}'

    - check_job_poll_limit:
        switch:
          - condition: $${poll_count >= max_polls}
            raise: "Timed out waiting for Cloud Run Job to complete"
        next: wait_for_job

    # Step 2: Dataform コンパイル（create も非同期）
    - reset_poll_for_compile:
        assign:
          - poll_count: 0

    - compile_dataform:
        try:
          call: http.post
          args:
            url: $${"https://dataform.googleapis.com/v1/" + dataform_parent + "/compilationResults"}
            auth:
              type: OAuth2
            body:
              gitCommitish: "main"
          result: compilation_result
        retry:
          predicate: $${http.default_retry_predicate}
          max_retries: 5
          backoff:
            initial_delay: 2
            max_delay: 32
            multiplier: 2

    - wait_for_compilation:
        call: sys.sleep
        args:
          seconds: $${poll_interval_seconds}

    - increment_compile_poll:
        assign:
          - poll_count: $${poll_count + 1}

    - get_compilation:
        try:
          call: http.get
          args:
            url: $${"https://dataform.googleapis.com/v1/" + compilation_result.body.name}
            auth:
              type: OAuth2
          result: compilation_status
        retry:
          predicate: $${http.default_retry_predicate}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 16
            multiplier: 2

    - check_compilation:
        switch:
          - condition: $${compilation_status.body.state == "SUCCEEDED"}
            next: reset_poll_for_invoke
          - condition: $${compilation_status.body.state == "FAILED" or compilation_status.body.state == "CANCELLED"}
            raise: '$${"Dataform compilation failed: " + default(compilation_status.body.errorStatus.message, compilation_status.body.state)}'
          - condition: $${poll_count >= max_polls}
            raise: "Timed out waiting for Dataform compilation"
        next: wait_for_compilation

    # Step 3: daily_batch タグのみ実行
    - reset_poll_for_invoke:
        assign:
          - poll_count: 0

    - execute_dataform:
        try:
          call: http.post
          args:
            url: $${"https://dataform.googleapis.com/v1/" + dataform_parent + "/workflowInvocations"}
            auth:
              type: OAuth2
            body:
              compilationResult: $${compilation_status.body.name}
              invocationConfig:
                includedTags:
                  - "daily_batch"
                transitiveDependenciesIncluded: true
          result: invocation_result
        retry:
          predicate: $${http.default_retry_predicate}
          max_retries: 5
          backoff:
            initial_delay: 2
            max_delay: 32
            multiplier: 2

    - wait_for_invocation:
        call: sys.sleep
        args:
          seconds: $${poll_interval_seconds}

    - increment_invoke_poll:
        assign:
          - poll_count: $${poll_count + 1}

    - get_invocation:
        try:
          call: http.get
          args:
            url: $${"https://dataform.googleapis.com/v1/" + invocation_result.body.name}
            auth:
              type: OAuth2
          result: invocation_status
        retry:
          predicate: $${http.default_retry_predicate}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 16
            multiplier: 2

    - check_invocation:
        switch:
          - condition: $${invocation_status.body.state == "SUCCEEDED"}
            next: return_result
          - condition: $${invocation_status.body.state == "FAILED" or invocation_status.body.state == "CANCELLED"}
            raise: '$${"Dataform invocation failed: " + invocation_status.body.state}'
          - condition: $${poll_count >= max_polls}
            raise: "Timed out waiting for Dataform invocation"
        next: wait_for_invocation

    - return_result:
        return: $${invocation_status.body}
